# HRMS 生产域名服务（Let's Encrypt）
# 证书：/etc/letsencrypt/live/phunzage-services/  (SAN: phunzage.fun, www, hrms, xiaogou)
# 上游：hrms.phunzage.fun -> 127.0.0.1:8080（生产）
# 重要：IP 直连 115.29.197.130:80 由 sites-available/hrms 块1 提供（桌面/Android 客户端），勿动
#
# 已剔除 test.phunzage.fun：testco 测试环境经核查从未被使用（audit_logs=0、后端日志仅启动种子、
# nginx 零请求），故不纳入证书——SAN 里留一个失效域名会导致整张证书续期失败。

# ---------- 80 -> 301 HTTPS（保留 ACME 验证通道） ----------
server {
    listen 80;
    listen [::]:80;
    server_name hrms.phunzage.fun;

    include /etc/nginx/snippets/acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- hrms.phunzage.fun（HRMS 生产，后端 8080） ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hrms.phunzage.fun;
    client_max_body_size 50m;

    ssl_certificate     /etc/letsencrypt/live/phunzage-services/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/phunzage-services/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/hrms/web;
    index index.html;

    # CORS：桌面端 file:// 与 Android WebView 跨源访问
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
    add_header Access-Control-Max-Age 86400 always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        if ($request_method = OPTIONS) { return 204; }
    }

    location /updates/ {
        alias /opt/hrms/updates/;
        add_header Content-Disposition 'attachment; filename="$1"';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
