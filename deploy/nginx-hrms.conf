# 服务器裸 IP 与兜底入口（不服务任何具体项目）
#
# 设计：服务器 IP 是基础设施，不对应任何项目；所有项目平级走二级域名。
#   块A = 兜底（default_server）：任何匹配不到 vhost 的 Host -> 404
#   块B = 裸 IP：115.29.197.130 / 127.0.0.1 / localhost -> 301 到 https://phunzage.fun
#
# 各项目域名入口（各自独立文件，互不影响）：
#   phunzage.fun / www        -> sites-available/apex-placeholder.conf
#   hrms.phunzage.fun         -> sites-available/hrms-domains.conf
#   xiaogou.phunzage.fun      -> sites-available/xiaogou-domains.conf
#
# 历史：此处曾是「IP 直连 HRMS 生产」的 default_server 块（客户端硬编码 http://115.29.197.130）。
# 客户端已改为走二级域名 + HTTPS（win 1.0.8 / android 1.0.6），故撤除该入口。

# ---------- 块A：兜底 404（default_server） ----------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Let's Encrypt HTTP-01 验证通道（未来新增子域、尚未建 vhost 时靠它兜住校验请求）
    include /etc/nginx/snippets/acme-challenge.conf;

    location / {
        return 404;
    }
}

# ---------- 块B：裸 IP -> 301 到 apex ----------
server {
    listen 80;
    server_name 115.29.197.130 127.0.0.1 localhost;

    include /etc/nginx/snippets/acme-challenge.conf;

    location / {
        return 301 https://phunzage.fun$request_uri;
    }
}
