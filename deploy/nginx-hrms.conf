# HRMS 主站 Nginx 配置（阶段3：域名 + IP 直连兼容）
# 结构：
#   块1 = IP 直连默认服务（listen 80 default_server，server_name _）
#          旧客户端（1.0.6/1.0.4 及更早）更新检查仍指向 http://115.29.197.130，保持 80 服务不断线
#   块2 = 域名服务（phunzage.fun / www.phunzage.fun）
#          由 certbot 负责把 80 跳转到 443 HTTPS；SSL 块由 certbot 注入
# 新客户端（1.0.7/1.0.5）指向 https://phunzage.fun（Cloudflare → 服务器 443 → 后端）
# 多公司：每家公司额外一个独立 conf（sites-enabled/hrms-<company>.conf），互不影响

# ---------- 块1：IP 直连（default_server，HTTP 80 保持服务） ----------
server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 50m;

    root /opt/hrms/web;
    index index.html;

    # CORS：桌面端 file:// 与 Android WebView 跨源访问
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
    add_header Access-Control-Max-Age 86400 always;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # API 预检直接返回 204
        if ($request_method = OPTIONS) { return 204; }
    }

    location /updates/ {
        alias /opt/hrms/updates/;
        add_header Content-Disposition 'attachment; filename="$1"';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---------- 块2：域名服务（80，certbot 会注入 443 + 跳转） ----------
server {
    listen 80;
    server_name phunzage.fun www.phunzage.fun;
    client_max_body_size 50m;

    root /opt/hrms/web;
    index index.html;

    # CORS：桌面端 file:// 与 Android WebView 跨源访问
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
    add_header Access-Control-Max-Age 86400 always;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # API 预检直接返回 204
        if ($request_method = OPTIONS) { return 204; }
    }

    location /updates/ {
        alias /opt/hrms/updates/;
        add_header Content-Disposition 'attachment; filename="$1"';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
