# 小购商城 / 心理健康助手（MHA）域名服务
# 上游：xiaogou.phunzage.fun -> 127.0.0.1:8085（docker mha-web 容器）
# 替代旧的 conf.d/mha.conf（server_name 原为 shop.050930.xyz，该域名已无解析）
#
# 前端已确认为同源相对路径（baseURL="/api"），换域名无需改构建。
# 容器内 nginx 负责 /api -> mha-backend:1236，本层只需保持 SSE 不缓冲。

# ---------- 80 -> 301 HTTPS（保留 ACME 验证通道） ----------
server {
    listen 80;
    listen [::]:80;
    server_name xiaogou.phunzage.fun;

    include /etc/nginx/snippets/acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- xiaogou.phunzage.fun（443，后端 8085） ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xiaogou.phunzage.fun;
    client_max_body_size 100m;

    ssl_certificate     /etc/letsencrypt/live/phunzage-services/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/phunzage-services/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 流式响应（AI 对话）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
