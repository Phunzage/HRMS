# apex 域名占位（phunzage.fun 已从 HRMS 解耦）
# 当前策略：暂不部署站点，返回一个极简占位页（后续换成博客/个人主页时直接替换 root 即可）
# 证书：/etc/letsencrypt/live/phunzage-services/（SAN 含 apex + www）

# ---------- 80 -> 301 HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name phunzage.fun www.phunzage.fun;

    include /etc/nginx/snippets/acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 443 占位页 ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name phunzage.fun www.phunzage.fun;
    client_max_body_size 10m;

    ssl_certificate     /etc/letsencrypt/live/phunzage-services/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/phunzage-services/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/placeholder;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
